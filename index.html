<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>Student Expense Tracker</h1><p>Manage and track your daily student expenses</p><div class="summary"><div><span>Total Spent</span><strong id="total">₹0</strong></div><div><span>Expenses</span><strong id="count">0</strong></div></div><form id="expenseForm"><input id="title" placeholder="Expense name" required><input id="amount" type="number" min="0" step="0.01" placeholder="Amount (₹)" required><select id="category"><option>Food</option><option>Travel</option><option>Education</option><option>Shopping</option><option>Other</option></select><button>Add Expense</button></form><h2>Expenses</h2><ul id="expenseList"></ul><button id="clearBtn" class="clear">Clear All</button></div><script src="script.js"></script></body></html>
